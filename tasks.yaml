# yaml-language-server: $schema=https://raw.githubusercontent.com/victor-software-house/qctl/main/schema/tasks.schema.json
schema_version: 6
prefix: SGD
active: SGD-009
queue:
  - id: SGD-009
    title: 'Install, run and update signd through each route: pkg, cask, MDM, self-update'
    scope: packaging
    outcome: "Opening signd.pkg is the whole install: the CLI is on the PATH and the agent runs, with no other step."
    blocked_by: []
    acceptance:
      - signd.pkg links /usr/local/bin/signd to the app binary, unless a file that is not a link is there.
      - After the pkg, signd status shows the agent answering; when Login Items needs approval, signd status says so and signd service enable opens that pane.
      - The README Install section starts from the pkg, with Homebrew as the second route.
      - 'After the pkg, ssh uses signd with no other step: signd adds Include ~/.ssh/signd/config at the top of ~/.ssh/config when no line includes it, creating the file when it is missing, and signd status shows whether the line is there.'
      - An MDM profile in the repository installs signd and approves its login item by team identifier, and a Mac enrolled with it runs the agent after the pkg with no click.
      - signd service status, restart and log report and control the agent as brew services does for a formula.
      - The cask uninstalls the login item, the receipt and the app, and its zap removes the sync state and ~/.ssh/signd.
      - Opening signd.pkg shows the signd background, a welcome, the AGPL license and a conclusion page, and Installer refuses an Intel Mac or an older macOS before it asks for a password.
    notes:
      - 2026-11-18, operator asked for an install as smooth as flowgate; signd needs no privacy permission, only its login item.
      - 2026-11-18, operator wants every pkg script to be one line that runs a signd command, with the logic in Swift; postinstall already does.
      - '2026-11-18, operator asked that the install needs no UI step, and that MDM can provision signd with none: the pkg through MDM, and a managed login items profile (com.apple.servicemanagement, by team identifier) so the agent needs no approval.'
      - An update keeps the login item, the keychain items and the iCloud container because each is tied to the team identifier and the bundle identifier, which every release keeps; signd needs no TCC grant.
      - '2026-11-18, operator decided: no Homebrew formula. It would only repackage the signed app, start a second agent beside the login item and show a bare Login Items row; signd service status, restart and log cover what brew services gives, and the cask stays the Homebrew route.'
      - '2026-11-18, operator decided the pkg gets a full Installer experience through a productbuild distribution file: the signd background in light and dark, a two-line welcome, the AGPL license, a conclusion page with what is ready and a first command, and checks that refuse an Intel Mac or an older macOS before the admin password.'
      - '2026-11-18, operator decided signd updates itself with its own updater, not Sparkle: Sparkle finds the running app through NSRunningApplication, which does not list a launchd agent, so it would install under the agent and never restart it; it prompts a standard user because /Applications is root:admin 775; and its framework links AppKit and WebKit into the agent. The cask sets auto_updates true, so brew upgrade leaves the app to the updater.'
      - 2026-11-18, operator decided the pkg is needed only for the first install and for MDM, and signd updates itself after that. The pkg postinstall hands Signd.app to the console user, as a drag install would, so the updater can swap it with no prompt. Under MDM the app stays root-owned, the updater stays off because it cannot swap a root-owned app, and MDM ships updates.
      - 2026-11-18, the own updater has its own row, SGD-014, and change, self-update.
      - 2026-11-19, the pkg-install change is archived with every task done; the MDM profile is the acceptance item left.
    plan: openspec/changes/mdm-profile/tasks.md

