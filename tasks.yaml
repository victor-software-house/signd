  - id: SGD-014
    title: Update signd itself from each release
    scope: packaging
    outcome: >-
      An installed signd moves to each new release with no prompt and no step from
      the user.
    blocked_by: []
    acceptance:
      - On a test Mac, an installed release updates to the next with no prompt, Login Items still lists signd as allowed, and the agent answers from the new version.
      - An app of another team, an unnotarized app, or a root-owned bundle leaves the installed app unchanged, and signd status says why.
    plan: openspec/changes/self-update/proposal.md
    notes:
      - 2026-11-18, operator decided signd updates itself with its own updater, not Sparkle; the reasons are in the SGD-009 notes.

  - id: SGD-013
    title: Back up keys to 1Password, apart from the iCloud sync
    scope: backup
    outcome: A key can be restored from a backup the user keeps outside iCloud.
    notes:
      - 2026-11-18, operator decided iCloud does the real-time sync and 1Password stays useful as a backup store, which needs its own design.
      - '2026-11-18, operator direction: iCloud is the source of truth, and a backup copies it one way into 1Password.'
      - '2026-11-18, operator direction: any live device runs the backup, hourly or daily or after a batch of changes, throttled, with a light lock so two devices never run it at once.'
      - 'Candidate lock: a lease record in the signd zone (holder device, expiry) taken with a save that fails when another device changed it first; it is a new production record type, so its name needs a review before deploy.'
      - 2026-11-18, operator decided the backup writes each shareable key as a 1Password SSH Key item in one vault, through a service account, so 1Password can sign with it when no Mac is left and a restore is an import. Secure Enclave keys cannot leave the chip, so the backup lists them for recreation. The rule that no private key leaves signd gains this one exception, for that vault only.
      - "2026-11-18, operator asked that the service account token be stored safely: it lives in the data-protection keychain in signd's access group, this device only, reaches other Macs only sealed to their Secure Enclave keys as keys do, never appears in a file, an argument, the environment or a log, and its service account can write only to the backup vault."
      - '2026-11-18, operator picked the schedule: a run 5 minutes after the last key change, at most once an hour, and once a day with no change. Each is a setting with that default, which the config file or an MDM profile can override (SGD-004).'
      - 2026-11-18, operator named the lock record type Lease and asked that it block nothing and expire on its own. CloudKit has no record expiry in its public API, so a Mac claims the lease by a conditional save (ifServerRecordUnchanged) with its device and an expiry 10 minutes out; a claim past its expiry counts as free and is taken over by the same save, and only the backup reads it.
      - 2026-11-18, operator decided the vault is dedicated, signd by default and set by a setting; the backup touches only the items it created, writes in quick batches, and avoids clutter by default with configurable removal. 1Password keeps a deleted item for 30 days, so deletion is the default and archive or keep are settings.
    blocked_by: []
    acceptance:
      - Both Macs show the backup on after one login, and the vault holds one signd-tagged SSH Key item per shared key.
      - Deleting a throwaway key puts its item in Recently Deleted, leaves a foreign item unchanged, and signd backup restore brings the key back so it signs on both Macs.
      - No SSH request waits on 1Password or on the lease.
    plan: openspec/changes/onepassword-backup/proposal.md

  - id: SGD-019
    title: Say when signd update repeats a recorded result
    scope: cli
    outcome: signd update tells a fresh check from a result it repeats.
    blocked_by: []
    acceptance:
      - Within 5 minutes of an install, signd update says the update was installed at its time, and does not read as a new install.
    notes:
      - '2026-11-19: the updater answers a request within 5 minutes of a check with the recorded result. After the update to 0.0.18 at 23:10:59 UTC, each later signd update printed installed 0.0.18; the agents restart on it, though no new install ran.'
      - '2026-11-20: signd #102 shipped in 0.0.19. The 0.0.18 updater recorded no install time, so a repeat right after the 0.0.19 install still read as an update; after the 5-minute window, signd update printed signd is up to date (0.0.19). The acceptance is checked at the 0.0.20 install, the first one a 0.0.19 updater runs.'

