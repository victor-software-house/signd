archive:
  - id: SGD-008
    title: Terminal output with Noora
    scope: cli
    outcome: >-
      signd marks results with colour and symbols on a terminal and stays plain
      everywhere else.
    notes:
      - 2026-11-18, operator picked Noora 0.57.7 to match qctl and verctl.
    plan: openspec/changes/archive/2026-11-19-terminal-output/proposal.md
    completed: 2026-11-19T23:13:00
    evidence:
      - '2026-11-19 UTC: 0.0.18 ships Noora terminal output (pull request 99): coloured ✔ ✘ ▲ on a terminal, plain text piped or under NO_COLOR and --color never, colour forced by CLICOLOR_FORCE and --color always, and JSON never coloured.'
      - The binary grew from 28,875,616 to 29,461,744 bytes.
    disposition: completed

  - id: SGD-017
    title: Apply a changed backup setting to the waiting run
    scope: backup
    outcome: >-
      A backup-delay or backup-min-interval change takes effect at once, and signd
      backup status shows the time the agent waits for.
    notes:
      - '2026-11-19 UTC: after signd config set lowered both settings, the agent kept the wait it had armed, while signd backup status showed the next backup as due; signd service restart started the run.'
      - '2026-11-19 UTC: cause: the agent read the schedule once, when it armed its timer, and nothing told it that another process had written a setting. Design: the command posts a Darwin notification after it writes a setting, and the agent arms the backup timer again when it arrives.'
    completed: 2026-11-19T19:41:58
    evidence:
      - '2026-11-19 UTC: on 0.0.16, a key imported at 19:40:40 set the next backup to 19:45:40; signd config set backup-delay 30s at 19:40:45 moved it to 19:41:10 with no restart, and the run ended ok at 19:41:10.'
      - 'The fix is pull request 93: config set and unset post a Darwin notification, and the agent arms the backup timer again from the new schedule.'
    disposition: completed

  - id: SGD-010
    title: Sync shared keys through iCloud
    scope: icloud-sync
    outcome: >-
      A key created or imported on one Mac reaches every Mac on the Apple account
      within a few seconds, with no account beyond iCloud.
    plan: openspec/changes/archive/2026-11-18-icloud-sync/proposal.md
    notes:
      - 2026-11-18, operator replaced the 1Password sync with CloudKit after a two-Mac trial; a 2-second check, a push as a hint.
      - 2026-11-18, operator picked automatic sharing to new Macs, sharing by default with --local, and no per-Mac limit for now.
    completed: 2026-11-18T22:53:43
    evidence:
      - 'Shipped in 0.0.8 and proven on both Macs: shares reach the other Mac in 0.8 to 3.2 s, and an hour of changes ran with no throttle.'
    disposition: completed

  - id: SGD-012
    title: Stop the slow signatures once the list request is measured
    scope: tests
    outcome: >-
      The test suite finishes in about the time of its slowest test that needs it, on
      the 3-core CI runner.
    notes:
      - 2026-11-18, on a test Mac aWrappedKeySignsFastOnceOpen took 0.18 s alone and 1.99 s beside slowSignaturesDoNotDelayAListRequest, whose 3,200 queued 5 ms signatures held the thread pool; on the 3-core runner both took 21 s.
    completed: 2026-11-18T14:35:44
    evidence:
      - '#38 merged: on the CI runner the test run took 4.35 s, down from 21.3 s (run 44318137485 against 44315790198); aWrappedKeySignsFastOnceOpen took 3.8 s beside the RSA test, and slowSignaturesDoNotDelayAListRequest no longer appears among the five slowest. On a test Mac, three runs: 0.17 to 0.18 s and 0.06 to 0.07 s.'
    disposition: completed

