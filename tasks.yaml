  - id: SGD-005
    title: Register keys with GitHub and other services on demand
    scope: registration
    outcome: >-
      A key declared for a service is made on each Mac and registered there, so no
      Mac needs the 1Password SSH agent.
    blocked_by:
      - SGD-004
    acceptance:
      - A Secure Enclave key declared for github.com is registered on the account as an authentication and a signing key, from the dotfiles, with no browser step.
      - Removing the declaration removes the key from the account.
      - The change records, per service, whether signd registers keys there and how.
    notes:
      - '2026-11-18, research: GitHub /user/keys and /user/ssh_signing_keys (write:public_key, admin:ssh_signing_key); GitLab /user/keys with usage_type; Bitbucket /2.0/users/{u}/ssh-keys.'
      - '2026-11-18, research: some Git hosts and VM providers have no supported key API, and a host that uses certificates needs no registration.'
      - Keys that a service issues are shared through iCloud by SGD-010.

